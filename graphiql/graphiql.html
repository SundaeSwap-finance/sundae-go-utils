<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphiQL 5 with React 19 and GraphiQL Explorer</title>
    <style>
      body {
        margin: 0;
      }

      #graphiql {
        height: 100dvh;
      }

      .loading {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
      }
    </style>
    <link rel="stylesheet" href="https://esm.sh/graphiql@5.2.2/dist/style.css" />
    <link
      rel="stylesheet"
      href="https://esm.sh/@graphiql/plugin-explorer@5.1.1/dist/style.css"
    />
    <!--
     * Versions pinned to match the official `examples/graphiql-cdn/index.html`.
     *
     * `@graphiql/react@0.37.4` and later regressed Monaco's language
     * registration on the esm.sh CDN build path: it threw
     * `Cannot set tokens provider for unknown language json` and the
     * editor was left with no syntax highlighting or autocomplete.
     * Upstream is tracking the bug at graphql/graphiql#4303 and PR
     * #4308 (the alpha-publish branch); until a fixed `latest` ships,
     * pin to the last known-good release (0.37.3) — the same pin the
     * upstream example deliberately ships with.
     *
     * `@emotion/is-prop-valid` is shimmed to a no-op data: URL to
     * silence the `module @emotion/is-prop-valid not found` console
     * error framer-motion triggers when it isn't installed
     * (motiondivision/motion#3126).
     *
     * The `?standalone` query tells esm.sh to bundle each module with
     * its dependencies (but not peerDependencies) into a single JS file.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.1.0",
          "react/": "https://esm.sh/react@19.1.0/",

          "react-dom": "https://esm.sh/react-dom@19.1.0",
          "react-dom/": "https://esm.sh/react-dom@19.1.0/",

          "graphiql": "https://esm.sh/graphiql@5.2.2?standalone&external=react,react-dom,@graphiql/react,graphql",
          "graphiql/": "https://esm.sh/graphiql@5.2.2/",
          "@graphiql/plugin-explorer": "https://esm.sh/@graphiql/plugin-explorer@5.1.1?standalone&external=react,@graphiql/react,graphql",
          "@graphiql/react": "https://esm.sh/@graphiql/react@0.37.3?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid",

          "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit@0.11.3?standalone&external=graphql",
          "graphql": "https://esm.sh/graphql@16.13.2",
          "@emotion/is-prop-valid": "data:text/javascript,"
        }
      }
    </script>
    <script type="module">
      // Import React and ReactDOM
      import React from 'react';
      import ReactDOM from 'react-dom/client';
      // Import GraphiQL and the Explorer plugin
      import { GraphiQL, HISTORY_PLUGIN } from 'graphiql';
      import { createGraphiQLFetcher } from '@graphiql/toolkit';
      import { explorerPlugin } from '@graphiql/plugin-explorer';
      // Side-effect import wires up the Monaco web workers with the
      // monaco-editor version @graphiql/react actually depends on
      // (currently 0.52.2). Setting up the workers manually meant
      // esm.sh defaulted to monaco-editor latest, which fell outside
      // monaco-graphql's `>= 0.20.0 < 0.53` peer-dep range — the worker
      // IPC mismatch broke editor autocomplete silently.
      import 'graphiql/setup-workers/esm.sh';

      const fetcherOpts = { url: '{{.Route}}' };
      {{ if .SubscriptionURL }}
      fetcherOpts.subscriptionUrl = '{{.SubscriptionURL}}';
      {{ end }}
      const fetcher = createGraphiQLFetcher(fetcherOpts);
      const plugins = [HISTORY_PLUGIN, explorerPlugin()];

      function App() {
        return React.createElement(GraphiQL, {
          fetcher,
          plugins,
          defaultEditorToolsVisibility: true,
        });
      }

      const container = document.getElementById('graphiql');
      const root = ReactDOM.createRoot(container);
      root.render(React.createElement(App));
    </script>
  </head>
  <body>
    <div id="graphiql">
      <div class="loading">Loading…</div>
    </div>
  </body>
</html>
